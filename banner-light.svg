<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Mohamed Zahran — joyful pixel banner">
  <defs>
    <pattern id="px" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#fff8ef"/>
      <rect width="9" height="9" fill="#fff1e0"/>
    </pattern>
    <!-- reusable pixel -->
  </defs>

  <!-- soft cream canvas -->
  <rect width="900" height="280" rx="14" fill="#fff4e8"/>
  <rect width="900" height="280" rx="14" fill="url(#px)" opacity="0.45"/>

  <!-- sky wash -->
  <rect x="0" y="0" width="900" height="120" fill="#ffe8c8" opacity="0.55"/>
  <rect x="0" y="120" width="900" height="40" fill="#ffd9b0" opacity="0.35"/>

  <!-- floating confetti pixels -->
  <g opacity="0.95">
    <rect x="48" y="36" width="10" height="10" fill="#ff6b4a"/>
    <rect x="68" y="52" width="10" height="10" fill="#ffd166"/>
    <rect x="88" y="28" width="10" height="10" fill="#06d6a0"/>
    <rect x="108" y="48" width="10" height="10" fill="#4ecdc4"/>
    <rect x="128" y="32" width="10" height="10" fill="#ff8fab"/>
    <rect x="780" y="40" width="10" height="10" fill="#ffd166"/>
    <rect x="800" y="58" width="10" height="10" fill="#ff6b4a"/>
    <rect x="820" y="34" width="10" height="10" fill="#06d6a0"/>
    <rect x="840" y="52" width="10" height="10" fill="#7bdff2"/>
    <rect x="860" y="28" width="10" height="10" fill="#ff8fab"/>
    <rect x="700" y="24" width="10" height="10" fill="#c77dff"/>
    <rect x="720" y="44" width="10" height="10" fill="#ffd166"/>
    <rect x="200" y="220" width="10" height="10" fill="#06d6a0"/>
    <rect x="220" y="240" width="10" height="10" fill="#ff6b4a"/>
    <rect x="640" y="230" width="10" height="10" fill="#4ecdc4"/>
    <rect x="660" y="248" width="10" height="10" fill="#ffd166"/>
  </g>

  <!-- pixel sun -->
  <g transform="translate(56,72)">
    <!-- rays -->
    <rect x="50" y="0" width="10" height="10" fill="#ffb703"/>
    <rect x="50" y="110" width="10" height="10" fill="#ffb703"/>
    <rect x="0" y="50" width="10" height="10" fill="#ffb703"/>
    <rect x="110" y="50" width="10" height="10" fill="#ffb703"/>
    <rect x="14" y="14" width="10" height="10" fill="#ffd166"/>
    <rect x="96" y="14" width="10" height="10" fill="#ffd166"/>
    <rect x="14" y="96" width="10" height="10" fill="#ffd166"/>
    <rect x="96" y="96" width="10" height="10" fill="#ffd166"/>
    <!-- core -->
    <rect x="30" y="20" width="50" height="10" fill="#ffd166"/>
    <rect x="20" y="30" width="70" height="10" fill="#ffd166"/>
    <rect x="20" y="40" width="70" height="10" fill="#ffea9f"/>
    <rect x="20" y="50" width="70" height="10" fill="#ffea9f"/>
    <rect x="20" y="60" width="70" height="10" fill="#ffd166"/>
    <rect x="30" y="70" width="50" height="10" fill="#ffd166"/>
    <!-- happy face -->
    <rect x="36" y="40" width="10" height="10" fill="#c45c00"/>
    <rect x="64" y="40" width="10" height="10" fill="#c45c00"/>
    <rect x="36" y="58" width="10" height="10" fill="#c45c00"/>
    <rect x="46" y="58" width="10" height="10" fill="#c45c00"/>
    <rect x="56" y="58" width="10" height="10" fill="#c45c00"/>
    <rect x="64" y="50" width="10" height="10" fill="#c45c00"/>
  </g>

  <!-- pixel cloud left -->
  <g transform="translate(190,48)">
    <rect x="20" y="20" width="50" height="10" fill="#ffffff"/>
    <rect x="10" y="30" width="80" height="10" fill="#ffffff"/>
    <rect x="0" y="40" width="100" height="10" fill="#ffffff"/>
    <rect x="10" y="50" width="80" height="10" fill="#f0f7ff"/>
    <rect x="30" y="10" width="30" height="10" fill="#ffffff"/>
  </g>

  <!-- pixel cloud mid-right -->
  <g transform="translate(620,56)">
    <rect x="20" y="20" width="40" height="10" fill="#ffffff"/>
    <rect x="10" y="30" width="70" height="10" fill="#ffffff"/>
    <rect x="0" y="40" width="90" height="10" fill="#ffffff"/>
    <rect x="10" y="50" width="70" height="10" fill="#eef8ff"/>
    <rect x="30" y="10" width="20" height="10" fill="#ffffff"/>
  </g>

  <!-- tiny pixel hearts -->
  <g transform="translate(300,38)">
    <rect x="0" y="10" width="10" height="10" fill="#ff6b9d"/>
    <rect x="20" y="10" width="10" height="10" fill="#ff6b9d"/>
    <rect x="0" y="20" width="30" height="10" fill="#ff6b9d"/>
    <rect x="10" y="30" width="10" height="10" fill="#ff6b9d"/>
  </g>
  <g transform="translate(760,90)">
    <rect x="0" y="10" width="10" height="10" fill="#ff8fab"/>
    <rect x="20" y="10" width="10" height="10" fill="#ff8fab"/>
    <rect x="0" y="20" width="30" height="10" fill="#ff8fab"/>
    <rect x="10" y="30" width="10" height="10" fill="#ff8fab"/>
  </g>

  <!-- pixel ground strip -->
  <g transform="translate(0,250)">
    <rect x="0" y="0" width="900" height="10" fill="#06d6a0"/>
    <rect x="0" y="10" width="900" height="10" fill="#04b888"/>
    <rect x="0" y="20" width="900" height="10" fill="#08956f"/>
    <!-- grass pixels -->
    <rect x="40" y="-10" width="10" height="10" fill="#06d6a0"/>
    <rect x="120" y="-10" width="10" height="10" fill="#2ec4b6"/>
    <rect x="200" y="-10" width="10" height="10" fill="#06d6a0"/>
    <rect x="360" y="-10" width="10" height="10" fill="#2ec4b6"/>
    <rect x="520" y="-10" width="10" height="10" fill="#06d6a0"/>
    <rect x="680" y="-10" width="10" height="10" fill="#2ec4b6"/>
    <rect x="820" y="-10" width="10" height="10" fill="#06d6a0"/>
  </g>

  <!-- name block -->
  <g transform="translate(300,78)">
    <rect x="-18" y="-18" width="430" height="150" rx="8" fill="#ffffff" opacity="0.72"/>
    <text x="0" y="42" font-family="'Courier New', Courier, monospace" font-size="48" font-weight="700" fill="#1d3557" letter-spacing="2">Mohamed</text>
    <text x="0" y="92" font-family="'Courier New', Courier, monospace" font-size="48" font-weight="700" fill="#e85d04" letter-spacing="2">Zahran</text>
    <rect x="0" y="108" width="40" height="8" fill="#06d6a0"/>
    <rect x="48" y="108" width="8" height="8" fill="#ffd166"/>
    <rect x="64" y="108" width="8" height="8" fill="#ff6b4a"/>
    <text x="0" y="132" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="700" fill="#457b9d" letter-spacing="1.5">FRONTEND ENGINEER · BUILDING WITH JOY</text>
  </g>
</svg>
