<svg xmlns="http://www.w3.org/2000/svg" width="900" height="280" viewBox="0 0 900 280" role="img" aria-label="Mohamed Zahran — joyful pixel banner dark">
  <defs>
    <pattern id="pxd" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="10" height="10" fill="#14121f"/>
      <rect width="9" height="9" fill="#1a1730"/>
    </pattern>
  </defs>

  <!-- night canvas -->
  <rect width="900" height="280" rx="14" fill="#120f1e"/>
  <rect width="900" height="280" rx="14" fill="url(#pxd)" opacity="0.7"/>

  <!-- aurora wash -->
  <rect x="0" y="0" width="900" height="90" fill="#2a1f4d" opacity="0.55"/>
  <rect x="0" y="90" width="900" height="40" fill="#1f2a44" opacity="0.4"/>

  <!-- twinkle stars -->
  <g>
    <rect x="40" y="28" width="8" height="8" fill="#ffe66d"/>
    <rect x="72" y="48" width="8" height="8" fill="#7bdff2"/>
    <rect x="110" y="22" width="8" height="8" fill="#ff8fab"/>
    <rect x="150" y="44" width="8" height="8" fill="#c77dff"/>
    <rect x="190" y="18" width="8" height="8" fill="#06d6a0"/>
    <rect x="700" y="26" width="8" height="8" fill="#ffe66d"/>
    <rect x="740" y="46" width="8" height="8" fill="#ff8fab"/>
    <rect x="780" y="20" width="8" height="8" fill="#7bdff2"/>
    <rect x="820" y="42" width="8" height="8" fill="#c77dff"/>
    <rect x="860" y="24" width="8" height="8" fill="#06d6a0"/>
    <rect x="640" y="34" width="8" height="8" fill="#ff6b4a"/>
    <rect x="250" y="56" width="8" height="8" fill="#ffe66d"/>
  </g>

  <!-- pixel moon -->
  <g transform="translate(58,70)">
    <rect x="30" y="10" width="50" height="10" fill="#f8f0c8"/>
    <rect x="20" y="20" width="70" height="10" fill="#f8f0c8"/>
    <rect x="20" y="30" width="70" height="10" fill="#efe4a8"/>
    <rect x="20" y="40" width="70" height="10" fill="#efe4a8"/>
    <rect x="20" y="50" width="70" height="10" fill="#f8f0c8"/>
    <rect x="30" y="60" width="50" height="10" fill="#f8f0c8"/>
    <!-- crescent cut -->
    <rect x="50" y="20" width="40" height="10" fill="#1a1730"/>
    <rect x="60" y="30" width="40" height="10" fill="#1a1730"/>
    <rect x="60" y="40" width="40" height="10" fill="#1a1730"/>
    <rect x="50" y="50" width="40" height="10" fill="#1a1730"/>
    <!-- smile -->
    <rect x="28" y="36" width="8" height="8" fill="#c45c00"/>
    <rect x="28" y="48" width="8" height="8" fill="#c45c00"/>
    <rect x="36" y="52" width="8" height="8" fill="#c45c00"/>
    <rect x="44" y="48" width="8" height="8" fill="#c45c00"/>
  </g>

  <!-- neon cloud -->
  <g transform="translate(190,50)">
    <rect x="20" y="20" width="50" height="10" fill="#3d3a5c"/>
    <rect x="10" y="30" width="80" height="10" fill="#4a4670"/>
    <rect x="0" y="40" width="100" height="10" fill="#3d3a5c"/>
    <rect x="10" y="50" width="80" height="10" fill="#2f2c4a"/>
    <rect x="30" y="10" width="30" height="10" fill="#4a4670"/>
    <rect x="40" y="30" width="10" height="10" fill="#7bdff2" opacity="0.8"/>
  </g>

  <g transform="translate(620,58)">
    <rect x="20" y="20" width="40" height="10" fill="#3d3a5c"/>
    <rect x="10" y="30" width="70" height="10" fill="#4a4670"/>
    <rect x="0" y="40" width="90" height="10" fill="#3d3a5c"/>
    <rect x="10" y="50" width="70" height="10" fill="#2f2c4a"/>
    <rect x="30" y="10" width="20" height="10" fill="#4a4670"/>
    <rect x="36" y="30" width="10" height="10" fill="#ff8fab" opacity="0.85"/>
  </g>

  <!-- tiny pixel hearts -->
  <g transform="translate(300,34)">
    <rect x="0" y="10" width="10" height="10" fill="#ff6b9d"/>
    <rect x="20" y="10" width="10" height="10" fill="#ff6b9d"/>
    <rect x="0" y="20" width="30" height="10" fill="#ff6b9d"/>
    <rect x="10" y="30" width="10" height="10" fill="#ff6b9d"/>
  </g>
  <g transform="translate(760,88)">
    <rect x="0" y="10" width="10" height="10" fill="#c77dff"/>
    <rect x="20" y="10" width="10" height="10" fill="#c77dff"/>
    <rect x="0" y="20" width="30" height="10" fill="#c77dff"/>
    <rect x="10" y="30" width="10" height="10" fill="#c77dff"/>
  </g>

  <!-- neon ground -->
  <g transform="translate(0,250)">
    <rect x="0" y="0" width="900" height="10" fill="#06d6a0"/>
    <rect x="0" y="10" width="900" height="10" fill="#048a68"/>
    <rect x="0" y="20" width="900" height="10" fill="#036348"/>
    <rect x="40" y="-10" width="10" height="10" fill="#7bdff2"/>
    <rect x="120" y="-10" width="10" height="10" fill="#06d6a0"/>
    <rect x="200" y="-10" width="10" height="10" fill="#ffe66d"/>
    <rect x="360" y="-10" width="10" height="10" fill="#ff8fab"/>
    <rect x="520" y="-10" width="10" height="10" fill="#7bdff2"/>
    <rect x="680" y="-10" width="10" height="10" fill="#06d6a0"/>
    <rect x="820" y="-10" width="10" height="10" fill="#c77dff"/>
  </g>

  <!-- name block -->
  <g transform="translate(300,78)">
    <rect x="-18" y="-18" width="430" height="150" rx="8" fill="#1c1833" opacity="0.82"/>
    <rect x="-18" y="-18" width="430" height="8" fill="#06d6a0" opacity="0.9"/>
    <text x="0" y="42" font-family="'Courier New', Courier, monospace" font-size="48" font-weight="700" fill="#f1faee" letter-spacing="2">Mohamed</text>
    <text x="0" y="92" font-family="'Courier New', Courier, monospace" font-size="48" font-weight="700" fill="#ff9f1c" letter-spacing="2">Zahran</text>
    <rect x="0" y="108" width="40" height="8" fill="#06d6a0"/>
    <rect x="48" y="108" width="8" height="8" fill="#ffe66d"/>
    <rect x="64" y="108" width="8" height="8" fill="#ff6b9d"/>
    <text x="0" y="132" font-family="'Courier New', Courier, monospace" font-size="13" font-weight="700" fill="#a8dadc" letter-spacing="1.5">FRONTEND ENGINEER · BUILDING WITH JOY</text>
  </g>
</svg>
